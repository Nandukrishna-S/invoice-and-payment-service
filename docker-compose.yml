services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 2s
      timeout: 3s
      retries: 20

  mockpsp:
    build:
      context: .
      target: mockpsp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://invoice:invoice@postgres:5432/invoice?sslmode=disable
    ports:
      - "127.0.0.1:8081:8081"

  api:
    build:
      context: .
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      mockpsp:
        condition: service_started
    environment:
      DATABASE_URL: postgres://invoice:invoice@postgres:5432/invoice?sslmode=disable
      PSP_URL: http://mockpsp:8081
      # Local development only: lets README curls work as is. Never set in production.
      DEMO_API_KEY: sk_test_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    ports:
      - "8080:8080"

volumes:
  pgdata:
